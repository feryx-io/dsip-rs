[package]
name = "dsip-cli"
description = "DSIP PoC command line: keygen, sign/verify, vector runner"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "dsip"
path = "src/main.rs"

[dependencies]
dsip-core.workspace = true
dsip-schema.workspace = true
dsip-session.workspace = true
dsip-transport.workspace = true
dsip-dht = { workspace = true, features = ["node"] }
dsip-media.workspace = true
dsip-broadcast.workspace = true
dsip-webrtc-binding.workspace = true
dsip-gateway.workspace = true
dsip-messaging.workspace = true
dsip-events.workspace = true
dsip-recording.workspace = true
dsip-wake.workspace = true
dsip-number.workspace = true
dsip-kt.workspace = true
libp2p.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
reqwest.workspace = true
mainline.workspace = true
futures-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Both media backends come from dsip-media's defaults; this passthrough remains for
# `--no-default-features` builds that want forge explicitly.
forge = ["dsip-media/forge"]
