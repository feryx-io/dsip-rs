[workspace]
resolver = "2"
members = [
    "crates/dsip-core",
    "crates/dsip-schema",
    "crates/dsip-session",
    "crates/dsip-endpoint",
    "crates/dsip-transport",
    "crates/dsip-wasm",
    "crates/dsip-media",
    "crates/dsip-webrtc-binding",
    "crates/dsip-gateway",
    "crates/dsip-messaging",
    "crates/dsip-events",
    "crates/dsip-recording",
    "crates/dsip-wake",
    "crates/dsip-number",
    "crates/dsip-kt",
    "crates/dsip-mls",
    "crates/dsip-messaging-device",
    "crates/dsip-mailbox",
    "crates/dsip-broadcast",
    "crates/dsip-dht",
    "crates/dsip-relay",
    "crates/dsip-push",
    "crates/dsip-cli",
    "crates/dsip-node",
    "crates/dsip-testkit",
    "crates/dsip-phone",
    "crates/dsip-messenger",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/feryx-io/DSIP"
rust-version = "1.85"

[workspace.dependencies]
redb = "2.6"
flate2 = "1"
x509-parser = "0.17"
toml = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "matched-path"] }
dsa = "0.6"
dsip-core = { path = "crates/dsip-core" }
dsip-schema = { path = "crates/dsip-schema" }
dsip-session = { path = "crates/dsip-session" }
dsip-endpoint = { path = "crates/dsip-endpoint" }
dsip-transport = { path = "crates/dsip-transport" }
dsip-dht = { path = "crates/dsip-dht", default-features = false }
dsip-media = { path = "crates/dsip-media" }
dsip-webrtc-binding = { path = "crates/dsip-webrtc-binding" }
dsip-gateway = { path = "crates/dsip-gateway" }
dsip-messaging = { path = "crates/dsip-messaging" }
dsip-events = { path = "crates/dsip-events" }
dsip-recording = { path = "crates/dsip-recording" }
dsip-wake = { path = "crates/dsip-wake" }
dsip-number = { path = "crates/dsip-number" }
dsip-kt = { path = "crates/dsip-kt" }
dsip-mls = { path = "crates/dsip-mls" }
dsip-messaging-device = { path = "crates/dsip-messaging-device" }
dsip-mailbox = { path = "crates/dsip-mailbox" }
dsip-broadcast = { path = "crates/dsip-broadcast" }
dsip-relay = { path = "crates/dsip-relay" }
dsip-push = { path = "crates/dsip-push" }
dsip-testkit = { path = "crates/dsip-testkit" }
dsip-phone = { path = "crates/dsip-phone" }
dsip-messenger = { path = "crates/dsip-messenger" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
curve25519-dalek = "4"
base64 = "0.22"
bs58 = "0.5"
sha2 = "0.10"
aes-gcm = "0.10"
aes = "0.8"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hex = "0.4"
rand = "0.8"
openssl = "0.10"
openssl-sys = "0.9"
foreign-types = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
# TypeScript declarations for the types that cross the browser boundary (dsip-rs B1); `Ts<T>`, never `into_wasm_abi`
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
jsonschema = { version = "0.50", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1"
rcgen = "0.13"
futures-util = "0.3"
mainline = { version = "8.0.1", default-features = false, features = ["async"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "kad", "identify", "macros", "ed25519"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = "thin"
